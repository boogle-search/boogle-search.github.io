<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BOOGLE GD SEARCH</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        h1 { text-shadow: 0 0 15px #00ff00; font-size: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .card { background: #111; border: 2px solid #333; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #00ff00; transform: scale(1.05); background: #1a1a1a; }
    </style>
</head>
<body>

    <h1>BOOGLE GD SEARCH</h1>
    <p>Select a game and BOOM!</p>
    
    <div id="game-list" class="grid">Scanning /games/ for HTML files...</div>

    <script>
        async function loadGames() {
    const container = document.getElementById('game-list');
    
    // Hardcoded URL - no variables to mess up!
    const url = "https://api.github.com";

    try {
        const response = await fetch(url);
        
        // If it's not working, let's find out why
        if (!response.ok) {
            console.error("GitHub API Response:", response.status, response.statusText);
            throw new Error(`Status ${response.status}: ${response.statusText}`);
        }

        const items = await response.json();
        container.innerHTML = ""; 

        items.forEach(item => {
            if (item.name.endsWith('.html')) {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h3>GD: ${item.name.replace('.html', '')}</h3>`;
                card.onclick = () => window.location.href = `./games/${item.name}`;
                container.appendChild(card);
            }
        });

        if (container.innerHTML === "") {
            container.innerHTML = "Folder 'games' is empty! Add your .html files to it.";
        }

    } catch (err) {
        container.innerHTML = `Error: Cannot find 'games' folder in boogle-search/geometrydashfree. <br><br> <small>API Error: ${err.message}</small>`;
        console.log("Check this URL in your browser to see if it works:", url);
    }
}
loadGames();


    </script>
</body>
</html>

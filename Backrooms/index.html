<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Full Environment</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #ffea00; text-align: center; background: rgba(0,0,0,0.9); 
            padding: 30px; border: 2px solid #ffea00; cursor: pointer; 
            font-family: 'Courier New', monospace; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()">
        <h1>THE BACKROOMS</h1>
        <p>CLICK TO ENTER</p>
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        // 1. ASSETS
        const wallImg = new Image(); wallImg.src = 'walls.png';
        const floorImg = new Image(); floorImg.src = 'floor.png';
        const ceilImg = new Image(); ceilImg.src = 'celing.png';

        function getCellType(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.9 + y * 78.2) * 43758;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            // Movement
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            // Low-res buffer for speed
            canvas.width = 300; canvas.height = 200;
            const imgData = ctx.createImageData(300, 200);

            // --- 2. FLOOR & CEILING CASTING ---
            for(let y = 0; y < 200; y++) {
                let isFloor = y > 100;
                let rayDirX0 = Math.cos(p.dir - 0.6);
                let rayDirY0 = Math.sin(p.dir - 0.6);
                let rayDirX1 = Math.cos(p.dir + 0.6);
                let rayDirY1 = Math.sin(p.dir + 0.6);

                let p_row = isFloor ? (y - 100) : (100 - y);
                let camZ = 100; // Vertical camera height
                let rowDist = camZ / p_row;

                let floorStepX = rowDist * (rayDirX1 - rayDirX0) / 300;
                let floorStepY = rowDist * (rayDirY1 - rayDirY0) / 300;
                let floorX = p.x + rowDist * rayDirX0;
                let floorY = p.y + rowDist * rayDirY0;

                for(let x = 0; x < 300; x++) {
                    let cellX = Math.floor(floorX);
                    let cellY = Math.floor(floorY);
                    
                    // LIGHTING LOGIC (Every 2 tiles)
                    let isLight = (!isFloor && cellX % 2 === 0 && cellY % 2 === 0);

                    // TILING: 4x for floor (Quarter scale), 1x for ceiling
                    let tx = Math.floor(((floorX * (isFloor ? 4 : 1)) % 1) * 64);
                    let ty = Math.floor(((floorY * (isFloor ? 4 : 1)) % 1) * 64);

                    let i = (y * 300 + x) * 4;
                    imgData.data[i] = isLight ? 255 : (isFloor ? 100 : 180);
                    imgData.data[i+1] = isLight ? 255 : (isFloor ? 100 : 180);
                    imgData.data[i+2] = isLight ? 200 : (isFloor ? 80 : 120);
                    imgData.data[i+3] = 255;

                    floorX += floorStepX; floorY += floorStepY;
                }
            }
            ctx.putImageData(imgData, 0, 0);

            // --- 3. DDA WALLS (Paste your working DDA logic here) ---
            // ... (Ensuring it overwrites the floor/ceiling pixels)

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

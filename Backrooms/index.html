<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Reality Restored</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffea00; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border: 2px solid #ffea00; cursor: pointer; font-family: monospace; z-index: 100; }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()"><h1>THE BACKROOMS</h1><p>CLICK TO ENTER</p></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const wallImg = new Image(); wallImg.src = 'walls.png';

        function getCell(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.98 + y * 78.23) * 43758;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            // Internal Resolution - FIXED TO MATCH MATH
            const vW = 400; const vH = 300;
            canvas.width = vW; canvas.height = vH;

            // 1. Draw Background (Solid Seam)
            ctx.fillStyle = "#888844"; ctx.fillRect(0, 0, vW, vH/2); // Ceiling
            ctx.fillStyle = "#444444"; ctx.fillRect(0, vH/2, vW, vH/2); // Floor

            // 2. DDA Raycasting (Locked to Seam)
            for(let x = 0; x < vW; x++) {
                let cameraX = 2 * x / vW - 1;
                let rDX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                let rDY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;

                let mX = Math.floor(p.x), mY = Math.floor(p.y);
                let dX = Math.abs(1/rDX), dY = Math.abs(1/rDY);
                let stX, stY, sX, sY;

                if(rDX<0){stX=-1;sX=(p.x-mX)*dX;}else{stX=1;sX=(mX+1-p.x)*dX;}
                if(rDY<0){stY=-1;sY=(p.y-mY)*dY;}else{stY=1;sY=(mY+1-p.y)*dY;}

                let hit=0, side=0;
                while(hit===0){
                    if(sX<sY){sX+=dX;mX+=stX;side=0;}else{sY+=dY;mY+=stY;side=1;}
                    if(getCell(mX, mY)>0)hit=1;
                }

                let pD = (side===0)?(sX-dX):(sY-dY);
                let h = Math.floor(vH / pD); // This height math now matches the vH/2 background
                let wallY = (vH - h) / 2;

                if(wallImg.complete){
                    let hitP = (side===0)?p.y+pD*rDY:p.x+pD*rDX;
                    let texX = Math.floor((hitP * 4 % 1) * wallImg.width);
                    
                    // Force wall to be solid black behind the texture
                    ctx.fillStyle = "#000"; ctx.fillRect(x, wallY, 1, h);
                    
                    for(let t=0; t<4; t++) {
                        ctx.drawImage(wallImg, texX, 0, 1, wallImg.height, x, wallY+(t*h/4), 1, h/4+1);
                    }
                }
                
                // Fog applied as a solid overlay to prevent gaps
                let fog = Math.min(pD / 12, 0.98);
                ctx.globalAlpha = fog; ctx.fillStyle = "#121505";
                ctx.fillRect(x, wallY, 1, h); ctx.globalAlpha = 1.0;
            }

            // Ceiling Lights - Fixed height for reality
            for(let lx = 0; lx < vW; lx += 100) {
                ctx.fillStyle = "rgba(255, 255, 230, 0.5)";
                ctx.fillRect(lx + 40, 50, 20, 10);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

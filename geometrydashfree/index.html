<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GD Scratch Compiled Search</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; text-align: center; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 40px; }
        .game-card { background: #222; border: 2px solid #333; padding: 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: #0f0; transform: scale(1.05); }
        h1 { color: #0f0; }
    </style>
</head>
<body>
    <h1>Boogle GD Search</h1>
    <p>Select a game and BOOM!</p>
    
    <div id="game-list" class="game-grid">
        <p>Loading compiled games...</p>
    </div>

    <script>
        async function loadGames() {
            const user = "boogle-search"; 
            const repo = "geometrydashfree"; // Update this to match your repo name exactly
            const container = document.getElementById('game-list');
            
            try {
                // Fetch the list of folders in the /games directory
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/games`);
                const contents = await response.json();
                
                container.innerHTML = ""; // Clear loading text

                // Loop through everything in /games
                contents.forEach(item => {
                    if (item.type === 'dir') { // Only look for folders (project IDs)
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = `<h3>GD Project: ${item.name}</h3>`;
                        
                        // When clicked, redirect to that game's index.html
                        card.onclick = () => {
                            window.location.href = `./games/${item.name}/index.html`;
                        };
                        
                        container.appendChild(card);
                    }
                });
            } catch (err) {
                container.innerHTML = "<p>Error loading games. Make sure the /games folder exists!</p>";
            }
        }

        loadGames();
    </script>
</body>
</html>

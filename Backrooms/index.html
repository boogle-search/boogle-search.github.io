<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Full Environment</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #ffea00; text-align: center; background: rgba(0,0,0,0.9); 
            padding: 30px; border: 2px solid #ffea00; cursor: pointer; 
            font-family: 'Courier New', monospace; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()">
        <h1>THE BACKROOMS</h1>
        <p>CLICK TO ENTER</p>
    </div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const wallImg = new Image(); wallImg.src = 'walls.png';

        function getCellType(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            // 1. MOVEMENT
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            canvas.width = 400; canvas.height = 300;
            const buffer = ctx.createImageData(400, 300);

            // 2. FLOOR & CEILING PASS (Drawn First)
            for(let y = 0; y < 300; y++) {
                let isFloor = y > 150;
                let p_dist = Math.abs(150 / (y - 150));

                for(let x = 0; x < 400; x++) {
                    let cameraX = 2 * x / 400 - 1;
                    let rayDirX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                    let rayDirY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;

                    let worldX = p.x + p_dist * rayDirX;
                    let worldY = p.y + p_dist * rayDirY;

                    // LIGHT LOGIC: White tile every 2 units on ceiling
                    let isLight = (!isFloor && Math.floor(worldX) % 2 === 0 && Math.floor(worldY) % 2 === 0);

                    // 4x TILING LOGIC for Floor (Quarters)
                    let checkX = Math.floor(worldX * (isFloor ? 4 : 1)) % 2;
                    let checkY = Math.floor(worldY * (isFloor ? 4 : 1)) % 2;
                    let pattern = (checkX === checkY);

                    let i = (y * 400 + x) * 4;
                    if (isLight) {
                        buffer.data[i] = 255; buffer.data[i+1] = 255; buffer.data[i+2] = 200; // Bright Light
                    } else {
                        // Color shading based on distance (Fog)
                        let fog = Math.min(p_dist / 10, 1);
                        let r = isFloor ? 80 : 140, g = isFloor ? 75 : 135, b = isFloor ? 50 : 80;
                        buffer.data[i] = r * (1 - fog) + 18 * fog;
                        buffer.data[i+1] = g * (1 - fog) + 21 * fog;
                        buffer.data[i+2] = b * (1 - fog) + 5 * fog;
                    }
                    buffer.data[i+3] = 255;
                }
            }
            ctx.putImageData(buffer, 0, 0);

            // 3. WALL PASS (Drawn on Top)
            for(let x=0; x < 400; x++) {
                let cameraX = 2 * x / 400 - 1;
                let rayDirX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                let rayDirY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;

                let mapX = Math.floor(p.x), mapY = Math.floor(p.y);
                let dX = Math.abs(1 / rayDirX), dY = Math.abs(1 / rayDirY);
                let stepX, stepY, sideX, sideY;

                if (rayDirX < 0) { stepX = -1; sideX = (p.x - mapX) * dX; }
                else { stepX = 1; sideX = (mapX + 1.0 - p.x) * dX; }
                if (rayDirY < 0) { stepY = -1; sideY = (p.y - mapY) * dY; }
                else { stepY = 1; sideY = (mapY + 1.0 - p.y) * dY; }

                let hit = 0, side = 0;
                while (hit === 0) {
                    if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
                    else { sideY += dY; mapY += stepY; side = 1; }
                    if (getCellType(mapX, mapY) > 0) hit = 1;
                }

                let pDist = (side === 0) ? (sideX - dX) : (sideY - dY);
                let h = Math.floor(300 / pDist);
                let wallY = (300 - h) / 2;

                if (wallImg.complete) {
                    let wHit = (side === 0) ? p.y + pDist * rayDirY : p.x + pDist * rayDirX;
                    wHit -= Math.floor(wHit);
                    let texX = Math.floor((wHit * 4 % 1) * wallImg.width);
                    let tilesV = 4, segH = h / tilesV;
                    for (let t = 0; t < tilesV; t++) {
                        ctx.drawImage(wallImg, texX, 0, 1, wallImg.height, x, wallY + (t * segH), 1, segH + 1);
                    }
                }
                
                // Final Depth Fog for Walls
                ctx.fillStyle = `rgba(18, 21, 5, ${Math.min(pDist / 10, 0.95)})`;
                ctx.fillRect(x, wallY, 1, h);
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Backrooms</title>

<style>
body{
margin:0;
overflow:hidden;
background:#121505;
}

canvas{
width:100vw;
height:100vh;
image-rendering:pixelated;
display:block;
}

#ui{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
color:#ffee55;
font-family:monospace;
padding:30px;
border:2px solid #ffee55;
cursor:pointer;
text-align:center;
}
</style>
</head>

<body>

<div id="ui" onclick="start();this.style.display='none'">
<h1>THE BACKROOMS</h1>
<p>CLICK TO START</p>
</div>

<canvas id="c"></canvas>

<script>

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

canvas.width=400;
canvas.height=300;

const wallImg=new Image();
wallImg.src="walls.png";

const floorImg=new Image();
floorImg.src="floor.png";

const ceilImg=new Image();
ceilImg.src="celing.png";


let player={
x:3,
y:3,
dir:0
};

const keys={};

function start(){

window.onkeydown=e=>keys[e.key.toLowerCase()]=true;
window.onkeyup=e=>keys[e.key.toLowerCase()]=false;

loop();

}


/* BACKROOMS STYLE MAP */

function getCell(x,y){

if(Math.abs(x)<4 && Math.abs(y)<4) return 0;

const size=8;

const gx=Math.floor(x/size);
const gy=Math.floor(y/size);

const n=Math.sin(gx*54.3+gy*12.7)*43758;

if((n-Math.floor(n))>0.7){

if(x%size===0 || y%size===0)
return 1;

}

return 0;

}


function loop(){

movePlayer();

drawWorld();

requestAnimationFrame(loop);

}


function movePlayer(){

if(keys["w"]){
player.x+=Math.cos(player.dir)*0.06;
player.y+=Math.sin(player.dir)*0.06;
}

if(keys["s"]){
player.x-=Math.cos(player.dir)*0.06;
player.y-=Math.sin(player.dir)*0.06;
}

if(keys["a"]) player.dir-=0.05;
if(keys["d"]) player.dir+=0.05;

}


function drawWorld(){

ctx.fillStyle="#888844";
ctx.fillRect(0,0,400,150);

ctx.fillStyle="#444";
ctx.fillRect(0,150,400,150);


/* RAYCAST */

for(let x=0;x<400;x++){

let cameraX=2*x/400-1;

let rayDirX=Math.cos(player.dir)+Math.sin(player.dir)*cameraX*-0.66;
let rayDirY=Math.sin(player.dir)-Math.cos(player.dir)*cameraX*-0.66;

let mapX=Math.floor(player.x);
let mapY=Math.floor(player.y);

let deltaX=Math.abs(1/rayDirX);
let deltaY=Math.abs(1/rayDirY);

let stepX,stepY;
let sideDistX,sideDistY;

if(rayDirX<0){
stepX=-1;
sideDistX=(player.x-mapX)*deltaX;
}else{
stepX=1;
sideDistX=(mapX+1-player.x)*deltaX;
}

if(rayDirY<0){
stepY=-1;
sideDistY=(player.y-mapY)*deltaY;
}else{
stepY=1;
sideDistY=(mapY+1-player.y)*deltaY;
}

let hit=0;
let side=0;

while(hit===0){

if(sideDistX<sideDistY){
sideDistX+=deltaX;
mapX+=stepX;
side=0;
}else{
sideDistY+=deltaY;
mapY+=stepY;
side=1;
}

if(getCell(mapX,mapY)>0)
hit=1;

}

let perpDist=(side===0)?(sideDistX-deltaX):(sideDistY-deltaY);

let lineHeight=Math.floor(300/perpDist);

let drawStart=(300-lineHeight)/2;


/* TEXTURE */

if(wallImg.complete){

let wallX=(side===0)
?player.y+perpDist*rayDirY
:player.x+perpDist*rayDirX;

wallX-=Math.floor(wallX);

let texX=Math.floor(wallX*wallImg.width);

ctx.fillStyle="#000";
ctx.fillRect(x,drawStart,1,lineHeight);


/* 4 BLOCK STACK */

for(let i=0;i<4;i++){

ctx.drawImage(
wallImg,
texX,
0,
1,
wallImg.height,
x,
drawStart+(i*lineHeight/4),
1,
lineHeight/4+1
);

}

}


/* FOG */

let fog=Math.min(perpDist/12,0.95);

ctx.globalAlpha=fog;
ctx.fillStyle="#121505";
ctx.fillRect(x,0,1,300);
ctx.globalAlpha=1;

}


/* CEILING LIGHTS */

for(let i=0;i<400;i+=100){

ctx.fillStyle="rgba(255,255,230,0.4)";
ctx.fillRect(i+40,60,20,10);

}

}

</script>

</body>
</html>

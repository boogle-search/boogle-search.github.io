<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offiz | Pro Workspace</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 75px 1fr;
      grid-template-columns: 280px 1fr;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #003366;
      /* YOUR BACKGROUND */
      background: url('https://i.ibb.co/7Nj7R6DY/Untitled-design-3.png') center/cover no-repeat fixed;
      overflow: hidden;
    }

    /* Glassmorphism Topbar */
    topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 20;
    }

    topbar h1 { font-size: 32px; font-weight: 900; margin: 0; letter-spacing: -0.5px; }
    clock { font-weight: 800; font-size: 18px; opacity: 0.8; }

    /* Navigation Sidebar */
    nav {
      padding: 30px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Workspace Layout */
    workspace {
      display: none; 
      padding: 40px;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      align-content: start;
      overflow-y: auto;
      animation: fadeIn 0.4s ease-out;
    }

    workspace.active { display: grid; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* THE CLEAN AERO TILE STYLE */
    section, .menu-tile, .task-item {
      position: relative;
      overflow: hidden;
      margin-bottom: 15px;
      padding: 25px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 40, 80, 0.1);
      cursor: pointer;
      transition: 0.4s ease;
    }

    section:hover, .menu-tile:hover, .task-item:hover { 
      transform: translateY(-5px); 
      background: rgba(255, 255, 255, 0.3); 
    }

    h3 { margin: 0 0 10px; font-size: 21px; font-weight: 600; }
    p { margin: 0 0 15px; font-size: 15px; line-height: 1.5; opacity: 0.9; }

    /* The Clean Aero Tag */
    .tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #003366;
    }
  </style>
</head>
<body>

  <topbar>
    <h1>Offiz</h1>
    <clock>00:00:00</clock>
  </topbar>

  <nav>
    <div class="menu-tile" onclick="showWS('dash')">Dashboard</div>
    <div class="menu-tile" onclick="showWS('work')">Work Center</div>
    <div class="menu-tile" onclick="showWS('settings')">Settings</div>
  </nav>

  <!-- DASHBOARD -->
  <workspace id="dash" class="active">
    <section id="profile-tile" onclick="changeName()">
      <h3 id="user-name">User Profile</h3>
      <p>Status: Aero Enthusiast</p>
      <span class="tag">Online</span>
    </section>

    <!-- GOOGLE-STYLE WEATHER WIDGET -->
    <section onclick="getWeather()">
      <h3 id="weather-city">Weather</h3>
      <p id="weather-status">Detecting location...</p>
      <span id="weather-temp" class="tag">--°F</span>
    </section>

    <section>
      <h3>Music Player</h3>
      <p>Now Playing: Liquid Skies</p>
      <span class="tag">Active</span>
    </section>
  </workspace>

  <!-- WORK CENTER -->
  <workspace id="work">
    <section onclick="addTask()">
      <h3>+ Add New Task</h3>
      <p>Click to schedule a new event.</p>
    </section>
    <!-- Dynamic Tasks inject here -->
  </workspace>

  <workspace id="settings">
    <section onclick="localStorage.clear(); location.reload();">
      <h3>System Reset</h3>
      <p>Wipe all local storage.</p>
      <span class="tag">Clear Data</span>
    </section>
  </workspace>

  <script>
    function showWS(id) {
      document.querySelectorAll('workspace').forEach(ws => ws.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function changeName() {
      let name = prompt("Enter your name:");
      if (name) { 
        localStorage.setItem('offiz_name', name);
        document.getElementById('user-name').innerText = name; 
      }
    }

    // --- GOOGLE-STYLE WEATHER FETCH WITH FALLBACK ---
async function getWeather() {
  const statusEl = document.getElementById('weather-status');
  const tempEl = document.getElementById('weather-temp');
  const cityEl = document.getElementById('weather-city');

  // 1. Check if we already have a city saved in LocalStorage
  const savedCity = localStorage.getItem('offiz_city');
  if (savedCity) {
    fetchCityWeather(savedCity);
    return;
  }

  // 2. Try Auto-Location
  if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        fetchWeather(pos.coords.latitude, pos.coords.longitude, "Local Skies");
      },
      () => {
        // 3. THE FALLBACK: Prompt if location is denied
        let city = prompt("Weather location blocked. Enter your City (e.g. New York):");
        if (city) {
          localStorage.setItem('offiz_city', city);
          fetchCityWeather(city);
        } else {
          statusEl.innerText = "Location Required";
        }
      }
    );
  }
}

async function fetchCityWeather(city) {
  try {
    // Converts city name to coordinates (Google-style geocoding)
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com{city}&count=1`);
    const geoData = await geoRes.json();
    
    if (geoData.results && geoData.results.length > 0) {
      const { latitude, longitude, name } = geoData.results[0];
      document.getElementById('weather-city').innerText = name;
      fetchWeather(latitude, longitude, "Live Skies");
    } else {
      document.getElementById('weather-status').innerText = "City not found";
    }
  } catch (e) {
    document.getElementById('weather-status').innerText = "Sync Error";
  }
}

async function fetchWeather(lat, lon, statusText) {
  try {
    const res = await fetch(`https://api.open-meteo.com{lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit`);
    const data = await res.json();
    document.getElementById('weather-temp').innerText = Math.round(data.current_weather.temperature) + "°F";
    document.getElementById('weather-status').innerText = statusText;
  } catch (e) {
    document.getElementById('weather-status').innerText = "Sync Error";
  }
}


    // --- CALENDAR SYSTEM ---
    function addTask() {
      let name = prompt("Event Name:");
      let time = prompt("Time:");
      if (name && time) {
        let tasks = JSON.parse(localStorage.getItem('offiz_tasks') || "[]");
        tasks.push({ name, time });
        localStorage.setItem('offiz_tasks', JSON.stringify(tasks));
        renderTasks();
      }
    }

    function renderTasks() {
      const container = document.getElementById('work');
      const tasks = JSON.parse(localStorage.getItem('offiz_tasks') || "[]");
      container.innerHTML = `<section onclick="addTask()"><h3>+ Add New Task</h3><p>Click to schedule a new event.</p></section>`;
      tasks.forEach(t => {
        container.innerHTML += `<div class="task-item"><h3>${t.name}</h3><p>Scheduled Event</p><span class="tag">${t.time}</span></div>`;
      });
    }

    window.onload = function() {
      const savedName = localStorage.getItem('offiz_name');
      if (savedName) document.getElementById('user-name').innerText = savedName;
      renderTasks();
      getWeather();
      setInterval(() => {
        document.querySelector('clock').innerText = new Date().toLocaleTimeString();
      }, 1000);
    };
  </script>
</body>
</html>

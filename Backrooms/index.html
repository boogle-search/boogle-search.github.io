<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Steady Raycaster</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: auto; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffea00; text-align: center; background: #000; padding: 30px; border: 2px solid #ffea00; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()"><h1>THE BACKROOMS</h1><p>CLICK TO ENTER</p></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const wallImg = new Image(); wallImg.src = 'walls.png';
        const floorImg = new Image(); floorImg.src = 'floor.png';
        const ceilImg = new Image(); ceilImg.src = 'celing.png';

        function getCellType(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            // HIGHER RESOLUTION = LESS FLASHING
            canvas.width = 800; canvas.height = 450;
            
            // 1. Draw Ceiling and Floor (Simple colors to stop the flashing)
            ctx.fillStyle = "#888844"; ctx.fillRect(0, 0, 800, 225); 
            ctx.fillStyle = "#444444"; ctx.fillRect(0, 225, 800, 225); 

            // 2. Continuous Raycasting
            const numRays = 800;
            for(let i=0; i < numRays; i++) {
                let rayAngle = p.dir - 0.6 + (i / numRays) * 1.2;
                let rx = p.x, ry = p.y;
                let vx = Math.cos(rayAngle) * 0.012; 
                let vy = Math.sin(rayAngle) * 0.012;
                let dist = 0;
                
                while(dist < 15) {
                    rx += vx; ry += vy; dist += 0.012;
                    if(getCellType(Math.floor(rx), Math.floor(ry)) === 1) break;
                }
                
                // Perspective Correction (Stops the "shimmering" wall edges)
                let correctedDist = dist * Math.cos(rayAngle - p.dir);
                let h = canvas.height / correctedDist;
                let wallY = (canvas.height - h) / 2;

                if (wallImg.complete) {
                    // TILING MATH: 4x horizontally
                    let hitX = rx % 1, hitY = ry % 1;
                    let texX_raw = (Math.abs(hitX - 0.5) > Math.abs(hitY - 0.5)) ? hitX : hitY;
                    let texX = (texX_raw * 4 % 1) * wallImg.width;
                    
                    // TILING MATH: 4x vertically
                    let segH = h / 4;
                    for (let t = 0; t < 4; t++) {
                        ctx.drawImage(wallImg, texX, 0, 1, wallImg.height, i, wallY + (t * segH), 1, segH + 1);
                    }
                }
                
                // Depth Fog (Stops the "clashing" in the distance)
                ctx.fillStyle = `rgba(18, 21, 5, ${Math.min(dist / 11, 0.98)})`;
                ctx.fillRect(i, wallY, 1, h);
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

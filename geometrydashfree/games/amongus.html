<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Among Us Clean</title>
    <script type="text/javascript" src="https://cdn.now.gg"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        #game-holder { width: 100vw; height: 100vh; display: block; position: relative; z-index: 10; }
    </style>
</head>
<body>
    <div id="game-holder"></div>
    <script>
        // If console shows "NowIfp is not defined", the script above failed to load.
        window.onload = function() {
            if (typeof NowIfp !== 'undefined') {
                NowIfp.init({
                    iframeParentElement: document.getElementById("game-holder"),
                    appId: "4047", // Official Among Us ID
                    appEventCallbackFunction: (e) => console.log("Game Event:", e),
                    sdkEventCallbackFunction: (e) => console.log("SDK Status:", e)
                });
            } else {
                console.error("SDK failed to load. Check your internet or ad-blocker.");
            }
        };
    </script>
</body>
</html>

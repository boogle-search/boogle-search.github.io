<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Final Reality Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffea00; text-align: center; background: rgba(0,0,0,0.9); padding: 30px; border: 2px solid #ffea00; cursor: pointer; font-family: monospace; z-index: 100; }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()"><h1>THE BACKROOMS</h1><p>CLICK TO ENTER</p></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const wallImg = new Image(); wallImg.src = 'walls.png';
        const floorImg = new Image(); floorImg.src = 'floor.png';
        const ceilImg = new Image(); ceilImg.src = 'celing.png';

        function getCell(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            // Movement
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            // Matching resolution to stop the floating effect
            canvas.width = 400; canvas.height = 300;

            // --- 1. DRAW BACKGROUND (FLOOR/CEILING FIRST) ---
            // Using patterns to ensure they stay locked to the screen
            const fPat = ctx.createPattern(floorImg, 'repeat');
            const cPat = ctx.createPattern(ceilImg, 'repeat');
            
            // Ceiling
            ctx.fillStyle = cPat || "#888844";
            ctx.fillRect(0, 0, 400, 150);
            
            // Floor
            ctx.save();
            ctx.scale(0.125, 0.125); // 1/8th scale
            ctx.fillStyle = fPat || "#444444";
            ctx.fillRect(0, 1200, 3200, 1200);
            ctx.restore();

            // --- 2. DDA WALLS (LOCKED TO GROUND) ---
            for(let x=0; x < 400; x++) {
                let cameraX = 2 * x / 400 - 1;
                let rDX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                let rDY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;
                let mX = Math.floor(p.x), mY = Math.floor(p.y);
                let dX = Math.abs(1/rDX), dY = Math.abs(1/rDY);
                let stX, stY, sX, sY;

                if(rDX<0){stX=-1;sX=(p.x-mX)*dX;}else{stX=1;sX=(mX+1-p.x)*dX;}
                if(rDY<0){stY=-1;sY=(p.y-mY)*dY;}else{stY=1;sY=(mY+1-p.y)*dY;}

                let hit=0, side=0;
                while(hit===0){
                    if(sX<sY){sX+=dX;mX+=stX;side=0;}else{sY+=dY;mY+=stY;side=1;}
                    if(getCell(mX, mY)>0)hit=1;
                }

                let pD = (side===0)?(sX-dX):(sY-dY);
                let h = Math.floor(300 / pD);
                let wY = (300 - h) / 2;

                if(wallImg.complete){
                    let hitP = (side===0)?p.y+pD*rDY:p.x+pD*rDX;
                    let texX = Math.floor((hitP*4%1)*wallImg.width);
                    // Drawing the 4x vertical repeat
                    for(let t=0; t<4; t++) {
                        ctx.drawImage(wallImg, texX, 0, 1, wallImg.height, x, wY+(t*h/4), 1, h/4+1);
                    }
                }
                
                // Atmosphere Fog (Fills the black gaps)
                let fog = Math.min(pD / 10, 0.98);
                ctx.fillStyle = `rgba(18, 21, 5, ${fog})`;
                ctx.fillRect(x, wY, 1, h);
            }

            // --- 3. RECESSED LIGHTS (Drawn last on Ceiling) ---
            for(let lx = 0; lx < 400; lx += 100) {
                ctx.fillStyle = "rgba(255, 255, 230, 0.5)";
                ctx.fillRect(lx + 40, 60, 20, 10);
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

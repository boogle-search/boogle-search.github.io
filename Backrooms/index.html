<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backrooms - Reality Restored</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121505; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffea00; text-align: center; background: rgba(0,0,0,0.95); padding: 30px; border: 2px solid #ffea00; cursor: pointer; font-family: monospace; z-index: 100; }
    </style>
</head>
<body>
    <div id="ui" onclick="this.style.display='none'; start()"><h1>THE BACKROOMS</h1><p>CLICK TO ENTER</p></div>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        const wallImg = new Image(); wallImg.src = 'walls.png';

        function getCell(x, y) {
            if (Math.abs(x) < 2 && Math.abs(y) < 2) return 0;
            const n = Math.sin(x * 12.98 + y * 78.23) * 43758;
            return (n - Math.floor(n)) > 0.85 ? 1 : 0;
        }
        
        let p = { x: 2.5, y: 2.5, dir: 0 };
        const keys = {};

        function start() {
            window.onkeydown = (e) => keys[e.key.toLowerCase()] = true;
            window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;
            loop();
        }

        function loop() {
            if(keys['w']) { p.x += Math.cos(p.dir)*0.06; p.y += Math.sin(p.dir)*0.06; }
            if(keys['s']) { p.x -= Math.cos(p.dir)*0.06; p.y -= Math.sin(p.dir)*0.06; }
            if(keys['a']) p.dir -= 0.05;
            if(keys['d']) p.dir += 0.05;

            // Internal Resolution
            const vW = 300; const vH = 200;
            canvas.width = vW; canvas.height = vH;
            const buffer = ctx.createImageData(vW, vH);

            // 1. TRUE FLOOR & CEILING CASTING (Syncs with Walls)
            for(let y = 0; y < vH; y++) {
                let isFloor = y > vH / 2;
                let p_z = vH / 2;
                let row_dist = Math.abs(p_z / (y - p_z));

                for(let x = 0; x < vW; x++) {
                    let cameraX = 2 * x / vW - 1;
                    let rDX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                    let rDY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;

                    let wX = p.x + row_dist * rDX;
                    let wY = p.y + row_dist * rDY;

                    // Light spacing: 2x2 grid
                    let tX = Math.floor(wX), tY = Math.floor(wY);
                    let rX = wX % 1, rY = wY % 1;
                    let isL = (!isFloor && tX % 2 === 0 && tY % 2 === 0 && rX > 0.35 && rX < 0.65 && rY > 0.35 && rY < 0.65);

                    let i = (y * vW + x) * 4;
                    if (isL) {
                        buffer.data[i] = 255; buffer.data[i+1] = 255; buffer.data[i+2] = 200;
                    } else {
                        let fog = Math.min(row_dist / 10, 1);
                        let r = isFloor ? 80 : 140, g = isFloor ? 75 : 135, b = isFloor ? 50 : 80;
                        buffer.data[i] = r * (1 - fog) + 18 * fog;
                        buffer.data[i+1] = g * (1 - fog) + 21 * fog;
                        buffer.data[i+2] = b * (1 - fog) + 5 * fog;
                    }
                    buffer.data[i+3] = 255;
                }
            }
            ctx.putImageData(buffer, 0, 0);

            // 2. WALLS (Correctly Planted)
            for(let x=0; x < vW; x++) {
                let cameraX = 2 * x / vW - 1;
                let rDX = Math.cos(p.dir) + Math.sin(p.dir) * cameraX * -0.66;
                let rDY = Math.sin(p.dir) - Math.cos(p.dir) * cameraX * -0.66;
                let mX = Math.floor(p.x), mY = Math.floor(p.y);
                let dX = Math.abs(1/rDX), dY = Math.abs(1/rDY);
                let stX, stY, sX, sY;

                if(rDX<0){stX=-1;sX=(p.x-mX)*dX;}else{stX=1;sX=(mX+1-p.x)*dX;}
                if(rDY<0){stY=-1;sY=(p.y-mY)*dY;}else{stY=1;sY=(mY+1-p.y)*dY;}

                let hit=0, side=0;
                while(hit===0){
                    if(sX<sY){sX+=dX;mX+=stX;side=0;}else{sY+=dY;mY+=stY;side=1;}
                    if(getCell(mX, mY)>0)hit=1;
                }

                let pD = (side===0)?(sX-dX):(sY-dY);
                let h = Math.floor(vH / pD);
                let wallY = (vH - h) / 2;

                if(wallImg.complete){
                    let hitP = (side===0)?p.y+pD*rDY:p.x+pD*rDX;
                    let texX = Math.floor((hitP * 4 % 1) * wallImg.width);
                    
                    // Draw Solid behind texture
                    ctx.fillStyle = "#000"; ctx.fillRect(x, wallY, 1, h);
                    
                    for(let t=0; t<4; t++) {
                        ctx.drawImage(wallImg, texX, 0, 1, wallImg.height, x, wallY+(t*h/4), 1, h/4+1);
                    }
                }
                // Atmosphere Fog matching the floor
                ctx.fillStyle = `rgba(18, 21, 5, ${Math.min(pD/10, 0.98)})`;
                ctx.fillRect(x, wallY, 1, h);
            }
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>

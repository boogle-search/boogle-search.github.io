<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BOOGLE GD SEARCH</title>
    <style>
        body { background: #050505; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        h1 { text-shadow: 0 0 15px #00ff00; font-size: 3rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
        .card { background: #111; border: 2px solid #333; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .card:hover { border-color: #00ff00; transform: scale(1.05); background: #1a1a1a; }
    </style>
</head>
<body>

    <h1>BOOGLE GD SEARCH</h1>
    <p>Select a game and BOOM!</p>
    
    <div id="game-list" class="grid">Scanning /games/ for HTML files...</div>

    <script>
        async function loadGames() {
    const container = document.getElementById('game-list');
    const url = "https://api.github.com";

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Folder not found");
        
        let items = await response.json();
        container.innerHTML = ""; 

        // FIX: If there is only one file, GitHub might not return a list.
        // This line forces it to be a list so the code doesn't crash.
        if (!Array.isArray(items)) {
            items = [items];
        }

        items.forEach(item => {
            if (item.name.endsWith('.html')) {
                const card = document.createElement('div');
                card.className = 'game-card';
                // This will show "GD: geometrydash"
                card.innerHTML = `<h3>GD: ${item.name.replace('.html', '')}</h3>`;
                
                // Boom! Takes you to your game
                card.onclick = () => window.location.href = `./games/${item.name}`;
                container.appendChild(card);
            }
        });

    } catch (err) {
        container.innerHTML = "Error: GitHub API is being glitchy. Try refreshing!";
        console.error(err);
    }
}
loadGames();

    </script>
</body>
</html>
